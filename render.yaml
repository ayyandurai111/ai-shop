services:
  - type: web
    name: ai-shop-mcp
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: PAYPAL_ENV
        value: sandbox
      - key: MAX_LIMIT
        value: "200"
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: BASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: DEMO_USER_ID
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: CHANNEL3_API_KEY
        sync: false
